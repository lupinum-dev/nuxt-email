name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.12.0
          - 24.x

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm lint

      - name: Prepare module and playground types
        run: pnpm dev:prepare

      - name: Type checks
        run: pnpm test:types

      - name: Unit, component, module, conformance, and production-bundle tests
        run: pnpm test

      - name: Conformance report reproducibility
        run: pnpm conformance:check

      - name: Check out the pinned React Email oracle source
        uses: actions/checkout@v6
        with:
          repository: resend/react-email
          ref: 6eb428924c4c2774228a07cbec1977ad8898f143
          fetch-depth: 0
          path: .oracle/react-email

      - name: React Email oracle reproducibility
        run: pnpm oracle:check
        env:
          NUXT_EMAIL_REACT_EMAIL_CHECKOUT: ${{ github.workspace }}/.oracle/react-email

      - name: Package build, contents, and fresh-install smoke test
        run: pnpm release:verify
