name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      full: ${{ steps.paths.outputs.full }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - name: Select required lanes
        id: paths
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const runAll = context.eventName !== 'pull_request'
            const files = runAll
              ? []
              : await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100,
                })
            const paths = files.map((file) => file.filename)
            const publicDocsOnly =
              paths.length > 0 &&
              paths.every((path) =>
                /^(?:docs\/content\/|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|MAINTAINING\.md$|AGENTS\.md$|CLAUDE\.md$|LICENSE$)/u.test(path),
              )
            const docsRelevant = paths.some((path) =>
              /^(?:docs\/|src\/|playground\/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$|nuxt\.config\.ts$)/u.test(path),
            )
            core.setOutput('full', String(runAll || !publicDocsOnly))
            core.setOutput('docs', String(runAll || docsRelevant))

  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }}
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # Node versions mirror the package `engines` contract
        # (`^22.18.0 || ^24.11.0 || ^26.0.0`): every supported major floor.
        # Node 20 is intentionally out of the v1 support contract.
        node-version:
          - 22.18.0
          - 24.11.0
          - 26.0.0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Action commits
        run: node scripts/verify-action-shas.mjs

      - name: Lint and formatting
        run: pnpm lint

      - name: Prepare and type-check module, fixtures, and playground
        run: pnpm test:types

      - name: Unit, component, module, conformance, and production-bundle tests
        run: pnpm test

      # The conformance-report, React Email oracle, and full package/fresh-install
      # verifications are runtime-heavy and platform-independent. Run them once on the
      # primary Linux runner at the Node floor rather than across every matrix cell.
      - name: Conformance report reproducibility
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        run: pnpm conformance:check

      - name: Check out the pinned React Email oracle source
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: resend/react-email
          ref: 6eb428924c4c2774228a07cbec1977ad8898f143
          fetch-depth: 0
          persist-credentials: false
          path: .oracle/react-email

      - name: React Email oracle reproducibility
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        run: pnpm oracle:check
        env:
          NUXT_EMAIL_REACT_EMAIL_CHECKOUT: ${{ github.workspace }}/.oracle/react-email

      - name: Package build, contents, and fresh-install smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        run: pnpm release:artifact

      - name: Retain the certified package
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuxt-email-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # The documentation site is a separate workspace member with a heavy prerender
  # (Sharp-backed OG images), so it runs once on Linux with an explicit heap budget.
  docs-site:
    name: Docs site build
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the docs site
        run: pnpm docs:build

  gate:
    name: CI gate
    if: always()
    needs:
      - classify
      - test
      - docs-site
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected lane
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL: ${{ needs.classify.outputs.full }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS: ${{ needs.classify.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs-site.result }}
        run: |
          test "$CLASSIFY_RESULT" = success
          if [ "$FULL" = true ]; then test "$TEST_RESULT" = success; else test "$TEST_RESULT" = skipped; fi
          if [ "$DOCS" = true ]; then test "$DOCS_RESULT" = success; else test "$DOCS_RESULT" = skipped; fi
