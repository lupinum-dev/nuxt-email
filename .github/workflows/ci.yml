name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # Node versions mirror the package `engines` contract
        # (`^22.18.0 || ^24.11.0 || ^26.0.0`): every supported major floor.
        # Node 20 is intentionally out of the v1 support contract.
        node-version:
          - 22.18.0
          - 24.11.0
          - 26.0.0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting
        run: pnpm lint

      - name: Prepare and type-check module, fixtures, and playground
        run: pnpm test:types

      - name: Unit, component, module, conformance, and production-bundle tests
        run: pnpm test

      # The conformance-report, React Email oracle, and full package/fresh-install
      # verifications are runtime-heavy and platform-independent. Run them once on the
      # primary Linux runner at the Node floor rather than across every matrix cell.
      - name: Conformance report reproducibility
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        run: pnpm conformance:check

      - name: Check out the pinned React Email oracle source
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: resend/react-email
          ref: 6eb428924c4c2774228a07cbec1977ad8898f143
          fetch-depth: 0
          persist-credentials: false
          path: .oracle/react-email

      - name: React Email oracle reproducibility
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        run: pnpm oracle:check
        env:
          NUXT_EMAIL_REACT_EMAIL_CHECKOUT: ${{ github.workspace }}/.oracle/react-email

      - name: Package build, contents, and fresh-install smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        run: pnpm release:artifact

      - name: Retain the certified package
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.18.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nuxt-email-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # The documentation site is a separate workspace member with a heavy prerender
  # (Sharp-backed OG images), so it runs once on Linux with an explicit heap budget.
  docs-site:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the docs site
        run: pnpm docs:build
