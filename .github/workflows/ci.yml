name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml starts this workflow on the Version packages PR, because pull
  # requests opened with GITHUB_TOKEN trigger no workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The verify and compatibility jobs replace the starter's task matrix (internals/decisions.md D3).
jobs:
  # `pnpm verify`: lint, typecheck, test, build, React Email oracle, packed consumers, dependency audit.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NUXT_EMAIL_REACT_EMAIL_CHECKOUT: ${{ github.workspace }}/.oracle/react-email
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the pinned React Email oracle source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: resend/react-email
          ref: 6eb428924c4c2774228a07cbec1977ad8898f143
          fetch-depth: 0
          persist-credentials: false
          path: .oracle/react-email
      - run: pnpm verify

  # Keep every supported Node floor and operating system in the compiler checks.
  # Full isolated consumers and the documentation build run once above.
  compatibility:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22.18.0 }
          - { os: windows-latest, node: 24.11.0 }
          - { os: macos-latest, node: 26.0.0 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test

  # The one required status check for the main branch ruleset.
  ci:
    name: ci
    if: always()
    needs: [verify, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          VERIFY: ${{ needs.verify.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
        run: test "$VERIFY" = success && test "$COMPATIBILITY" = success
