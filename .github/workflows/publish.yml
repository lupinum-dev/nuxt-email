name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuxt-email
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}

    steps:
      - name: Require protected main and a safe release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e "if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid release version')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$tag_sha" ]; then
            test "$tag_sha" = "$GITHUB_SHA"
            gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id // empty')"
          test -n "$run_id"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuxt-email-release
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify exact artifact and committed release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const m=require('./.release/release-artifact.json');const file='.release/lupinum-nuxt-email.tgz';const bytes=fs.readFileSync(file);const channel=m.packageVersion.includes('-')?'next':'latest';if(m.schemaVersion!==2||m.packageName!=='@lupinum/nuxt-email'||m.packageVersion!==process.env.RELEASE_VERSION||m.channel!==channel||m.commit!==process.env.GITHUB_SHA||m.sourceClean!==true||m.tarball!=='lupinum-nuxt-email.tgz'||m.sha1!==crypto.createHash('sha1').update(bytes).digest('hex')||m.sha256!==crypto.createHash('sha256').update(bytes).digest('hex'))throw new Error('Artifact failed exact-SHA validation')"
          sha256sum --check .release/SHA256SUMS
          awk -v version="v$RELEASE_VERSION" '$0 == "## " version { capture=1 } capture && /^## / && $0 != "## " version { exit } capture' CHANGELOG.md > .release/release-notes.md
          test -s .release/release-notes.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-email-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      bootstrap: ${{ steps.publish.outputs.bootstrap }}

    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-email-release
          path: .release

      - name: Publish or verify the certified tarball
        id: publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'

          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }

          const manifest = JSON.parse(readFileSync('.release/release-artifact.json', 'utf8'))
          if (manifest.packageVersion !== process.env.RELEASE_VERSION) fail('Release version differs.')
          const npmVersion = run(['--version']).stdout.trim().split('.').map(Number)
          if (npmVersion[0] < 11 || (npmVersion[0] === 11 && npmVersion[1] < 5)) fail('npm 11.5 or newer is required.')

          const spec = `${manifest.packageName}@${manifest.packageVersion}`
          const existing = view(spec, 'dist.shasum')
          if (existing && existing !== manifest.sha1) fail(`${spec} exists with different bytes.`)
          let mode
          if (existing) {
            const attestations = view(spec, 'dist.attestations')
            const published = view(manifest.packageName, 'versions')
            const versions = Array.isArray(published) ? published : [published]
            if (!attestations && (versions.length !== 1 || versions[0] !== manifest.packageVersion)) {
              fail(`${spec} is not the first package version and has no provenance.`)
            }
            mode = attestations ? 'oidc' : 'bootstrap'
          } else {
            const result = run([
              'publish', `.release/${manifest.tarball}`, '--access', 'public',
              '--tag', manifest.channel, '--ignore-scripts', '--provenance',
            ], true)
            if (result.status !== 0) fail(`npm publish failed for ${spec}.`)
            mode = 'oidc'
          }

          for (let attempt = 0; attempt < 12; attempt += 1) {
            const shasum = view(spec, 'dist.shasum')
            const attestations = view(spec, 'dist.attestations')
            const channel = view(manifest.packageName, `dist-tags.${manifest.channel}`)
            const published = mode === 'bootstrap' ? view(manifest.packageName, 'versions') : null
            const versions = Array.isArray(published) ? published : [published]
            const remainsFirstVersion = mode !== 'bootstrap' || (
              versions.length === 1 && versions[0] === manifest.packageVersion
            )
            if (
              shasum === manifest.sha1 &&
              channel === manifest.packageVersion &&
              remainsFirstVersion &&
              (mode === 'bootstrap' || (mode === 'oidc' && attestations))
            ) {
              appendFileSync(process.env.GITHUB_OUTPUT, `bootstrap=${String(mode === 'bootstrap')}\n`)
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nPublication mode: ${mode}.\n`)
              process.exit(0)
            }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 5000)
          }
          fail(`${spec} did not expose the required bytes, provenance mode, and ${manifest.channel}.`)
          NODE

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-email-release
          path: .release

      - name: Create the release for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          BOOTSTRAP_RELEASE: ${{ needs.publish.outputs.bootstrap }}
        run: |
          if [ "$BOOTSTRAP_RELEASE" = true ]; then
            cat >> .release/release-notes.md <<'NOTICE'

          > [!NOTE]
          > This first npm version was created from the exact CI-certified artifact before npm trusted publishing could be configured. npm does not provide GitHub OIDC provenance for this bootstrap publication. The protected workflow verified the registry bytes. Later versions use trusted publishing with provenance.
          NOTICE
          fi
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq '.object.sha')"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "v$RELEASE_VERSION" .release/lupinum-nuxt-email.tgz --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --title "v$RELEASE_VERSION" --notes-file .release/release-notes.md
          else
            prerelease=()
            case "$RELEASE_VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "v$RELEASE_VERSION" .release/lupinum-nuxt-email.tgz \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$RELEASE_VERSION" \
              --notes-file .release/release-notes.md \
              "${prerelease[@]}"
          fi
