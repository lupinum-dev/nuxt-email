name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuxt-email
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      publish-required: ${{ steps.registry.outputs.publish-required }}

    steps:
      - name: Require protected main and a safe release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e "if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid release version')"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$GITHUB_SHA"
          tag_ref="refs/tags/v$RELEASE_VERSION"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$RELEASE_VERSION" --jq ".[] | select(.ref == \"$tag_ref\") | [.object.type, .object.sha] | @tsv")"
          if test -n "$tag_object"; then
            IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
            while test "$tag_type" = tag; do
              tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '[.object.type, .object.sha] | @tsv')"
              IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
            done
            test "$tag_type" = commit
            test "$tag_sha" = "$GITHUB_SHA"
          fi

      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id // empty')"
          test -n "$run_id"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install isolated Sigstore verifier
        env:
          SIGSTORE_PREFIX: ${{ runner.temp }}/sigstore
        run: |
          mkdir -p "$SIGSTORE_PREFIX"
          cp scripts/sigstore-verifier/package.json \
            scripts/sigstore-verifier/package-lock.json \
            "$SIGSTORE_PREFIX/"
          npm ci --prefix "$SIGSTORE_PREFIX" --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuxt-email-release
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify exact artifact
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const m=require('./.release/release-artifact.json');const file='.release/lupinum-nuxt-email.tgz';const bytes=fs.readFileSync(file);const channel=m.packageVersion.includes('-')?'next':'latest';if(m.schemaVersion!==2||m.packageName!=='@lupinum/nuxt-email'||m.packageVersion!==process.env.RELEASE_VERSION||m.channel!==channel||m.commit!==process.env.GITHUB_SHA||m.sourceClean!==true||m.tarball!=='lupinum-nuxt-email.tgz'||m.sha1!==crypto.createHash('sha1').update(bytes).digest('hex')||m.sha256!==crypto.createHash('sha256').update(bytes).digest('hex'))throw new Error('Artifact failed exact-SHA validation')"
          (cd .release && sha256sum --check SHA256SUMS)

      - name: Verify registry recovery state
        id: registry
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SIGSTORE_PREFIX: ${{ runner.temp }}/sigstore
        run: |
          node scripts/verify-npm-recovery.mjs
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const record = JSON.parse(readFileSync('.release/registry-verification.json', 'utf8'))
          appendFileSync(process.env.GITHUB_OUTPUT, `publish-required=${record.registryState === 'absent'}\n`)
          NODE

      - name: Extract committed release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          awk -v version="v$RELEASE_VERSION" '$0 == "## " version { capture=1 } capture && /^## / && $0 != "## " version { exit } capture' CHANGELOG.md > .release/release-notes.md
          test -s .release/release-notes.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-email-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to npm
    needs: verify
    if: needs.verify.outputs.publish-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-email-release
          path: .release

      - name: Publish or verify the certified tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { appendFileSync, readFileSync } from 'node:fs'

          const fail = message => { throw new Error(message) }
          const run = (args, inherit = false) => spawnSync('npm', args, {
            encoding: 'utf8',
            stdio: inherit ? 'inherit' : ['ignore', 'pipe', 'pipe'],
          })
          const view = (spec, field) => {
            const result = run(['view', spec, field, '--json'])
            if (result.status === 0) return JSON.parse(result.stdout.trim() || 'null')
            if (/E404|404 Not Found/.test(result.stderr)) return null
            fail(`npm view failed for ${spec} ${field}: ${result.stderr.trim()}`)
          }
          const hasProvenance = metadata =>
            typeof metadata?.url === 'string' && metadata.url.length > 0 &&
            metadata.provenance?.predicateType === 'https://slsa.dev/provenance/v1'
          const provenanceBundleHash = async metadata => {
            if (!hasProvenance(metadata)) fail('The current npm provenance metadata is incomplete.')
            let url
            try {
              url = new URL(metadata.url)
            } catch {
              fail('The current npm provenance URL is invalid.')
            }
            if (
              url.origin !== 'https://registry.npmjs.org' ||
              url.username || url.password || url.search || url.hash ||
              !/^\/-\/npm\/v1\/attestations\/[^/]+$/.test(url.pathname)
            ) fail('The current npm provenance URL is outside the registry attestation API.')
            const response = await fetch(url, {
              headers: { Accept: 'application/json' },
              redirect: 'error',
              signal: AbortSignal.timeout(15000),
            })
            if (!response.ok) fail(`npm provenance lookup failed: HTTP ${response.status}.`)
            const document = await response.json()
            const attestations = (document?.attestations ?? []).filter(
              attestation => attestation.predicateType === 'https://slsa.dev/provenance/v1',
            )
            if (attestations.length !== 1 || !attestations[0]?.bundle) {
              fail('The current npm version has no unique provenance bundle.')
            }
            return createHash('sha256')
              .update(JSON.stringify(attestations[0].bundle))
              .digest('hex')
          }

          const manifest = JSON.parse(readFileSync('.release/release-artifact.json', 'utf8'))
          const record = JSON.parse(readFileSync('.release/registry-verification.json', 'utf8'))
          const pollAttempts = Number(process.env.REGISTRY_POLL_ATTEMPTS ?? 240)
          const pollDelayMs = Number(process.env.REGISTRY_POLL_DELAY_MS ?? 5000)
          if (!Number.isSafeInteger(pollAttempts) || pollAttempts < 1) fail('Invalid registry poll attempt count.')
          if (!Number.isSafeInteger(pollDelayMs) || pollDelayMs < 0) fail('Invalid registry poll delay.')
          if (manifest.packageVersion !== process.env.RELEASE_VERSION) fail('Release version differs.')
          const npmVersion = run(['--version']).stdout.trim().split('.').map(Number)
          if (npmVersion[0] < 11 || (npmVersion[0] === 11 && npmVersion[1] < 5)) fail('npm 11.5 or newer is required.')
          if (!/^[a-z0-9._-]+\.tgz$/.test(manifest.tarball)) fail('Unsafe tarball filename.')

          const bytes = readFileSync(`.release/${manifest.tarball}`)
          const shasum = createHash('sha1').update(bytes).digest('hex')
          const sha512 = createHash('sha512').update(bytes).digest('hex')
          const channel = manifest.packageVersion.includes('-') ? 'next' : 'latest'

          const spec = `${manifest.packageName}@${manifest.packageVersion}`
          const recordKeys = [
            'packageName', 'packageVersion', 'provenanceBundleSha256', 'registryShasum',
            'registryState', 'schemaVersion', 'sourceSha', 'tarball', 'tarballSha1',
            'tarballSha512',
          ]
          const verifiedExisting =
            record.registryState === 'verified-existing' &&
            /^[0-9a-f]{40}$/.test(record.registryShasum) &&
            /^[0-9a-f]{64}$/.test(record.provenanceBundleSha256)
          if (
            Object.keys(record).sort().join(',') !== recordKeys.join(',') ||
            record.schemaVersion !== 1 ||
            record.packageName !== '@lupinum/nuxt-email' ||
            record.packageName !== manifest.packageName ||
            record.packageVersion !== process.env.RELEASE_VERSION ||
            record.packageVersion !== manifest.packageVersion ||
            record.sourceSha !== process.env.GITHUB_SHA ||
            record.sourceSha !== manifest.commit ||
            record.tarball !== manifest.tarball ||
            record.tarballSha1 !== shasum ||
            record.tarballSha512 !== sha512 ||
            !(
              record.registryState === 'absent' && record.registryShasum === null &&
                record.provenanceBundleSha256 === null ||
              verifiedExisting
            )
          ) fail('Registry verification record does not match the certified artifact.')

          const registryVersion = view(spec, 'version')
          const currentShasum = registryVersion === null ? null : view(spec, 'dist.shasum')
          if (
            registryVersion !== null && registryVersion !== manifest.packageVersion ||
            currentShasum !== record.registryShasum
          ) {
            fail(`${spec} registry existence or bytes changed after verification.`)
          }
          if (
            record.registryState === 'verified-existing' &&
            await provenanceBundleHash(view(spec, 'dist.attestations')) !==
              record.provenanceBundleSha256
          ) {
            fail(`${spec} provenance bundle changed after verification.`)
          }

          if (record.registryState === 'absent') {
            const result = run([
              'publish', `.release/${manifest.tarball}`, '--access', 'public',
              '--tag', channel, '--ignore-scripts', '--provenance',
            ], true)
            if (result.status !== 0) {
              fail(`npm publish failed for ${spec}.`)
            }
          }

          for (let attempt = 0; attempt < pollAttempts; attempt += 1) {
            const shasum = view(spec, 'dist.shasum')
            const provenance = view(spec, 'dist.attestations')
            const distTag = view(manifest.packageName, `dist-tags.${channel}`)
            if (
              shasum === record.tarballSha1 &&
              distTag === manifest.packageVersion &&
              hasProvenance(provenance)
            ) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\nPublication mode: trusted publishing with provenance.\n')
              process.exit(0)
            }
            Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, pollDelayMs)
          }
          fail(`${spec} did not expose the required bytes, provenance mode, and ${channel}.`)
          NODE

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-email-release
          path: .release

      - name: Create or repair the release for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          TARBALL=$(node -e "process.stdout.write(require('./.release/release-artifact.json').tarball)")
          RELEASE_TAG="v$RELEASE_VERSION"
          PRERELEASE_CREATE=()
          PRERELEASE_EDIT=(--prerelease=false)
          case "$RELEASE_VERSION" in
            *-*) PRERELEASE_CREATE=(--prerelease); PRERELEASE_EDIT=(--prerelease) ;;
          esac
          release_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          case "$release_status" in
            404) release_exists=false ;;
            200) release_exists=true ;;
            *) echo "Could not verify GitHub release state (HTTP $release_status)" >&2; exit 1 ;;
          esac
          tag_status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          case "$tag_status" in
            404)
              if [ "$release_exists" = true ]; then
                echo "The existing GitHub release has no tag." >&2
                exit 1
              fi
              if ! tag_error="$(gh api --silent --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$SOURCE_SHA" 2>&1)"; then
                if printf '%s' "$tag_error" | grep -Eq 'HTTP 403|Resource not accessible by integration'; then
                  echo "::error::HUMAN-ONLY: GitHub cannot create this historical tag with GITHUB_TOKEN."
                  echo "HUMAN-ONLY: gh api --method POST \"repos/$GITHUB_REPOSITORY/git/refs\" -f ref=\"refs/tags/$RELEASE_TAG\" -f sha=\"$SOURCE_SHA\""
                else
                  printf '%s\n' "$tag_error" >&2
                fi
                exit 1
              fi
              ;;
            200) ;;
            *) echo "Could not verify tag state (HTTP $tag_status)" >&2; exit 1 ;;
          esac
          tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          while test "$tag_type" = tag; do
            tag_type="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.type')"
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
          done
          test "$tag_type" = commit
          test "$tag_sha" = "$SOURCE_SHA"
          if [ "$release_exists" = true ]; then
            gh release upload "$RELEASE_TAG" ".release/$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file .release/release-notes.md "${PRERELEASE_EDIT[@]}"
          else
            gh release create "$RELEASE_TAG" ".release/$TARBALL" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file .release/release-notes.md \
              "${PRERELEASE_CREATE[@]}"
          fi
