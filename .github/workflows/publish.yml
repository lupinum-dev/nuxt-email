name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from package.json
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-nuxt-email
  cancel-in-progress: false

jobs:
  verify:
    name: Verify certified artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}

    steps:
      - name: Require protected main and a new version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e "if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_VERSION)) throw new Error('Invalid release version')"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists" >&2
            exit 1
          fi

      - name: Find successful CI for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=completed&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success" and .head_branch == "main")) | first | .id // empty')"
          test -n "$run_id"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nuxt-email-release
          path: .release
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run-id }}

      - name: Verify exact artifact and committed release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "const fs=require('node:fs');const crypto=require('node:crypto');const m=require('./.release/release-artifact.json');const file='.release/lupinum-nuxt-email.tgz';const digest=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(m.schemaVersion!==1||m.packageName!=='@lupinum/nuxt-email'||m.packageVersion!==process.env.RELEASE_VERSION||m.commit!==process.env.GITHUB_SHA||m.sourceClean!==true||m.tarball!=='lupinum-nuxt-email.tgz'||m.sha256!==digest)throw new Error('Artifact failed exact-SHA validation')"
          sha256sum --check .release/SHA256SUMS
          awk -v version="v$RELEASE_VERSION" '$0 == "## " version { capture=1 } capture && /^## / && $0 != "## " version { exit } capture' CHANGELOG.md > .release/release-notes.md
          test -s .release/release-notes.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-nuxt-email-release
          path: .release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-email-release
          path: .release

      - name: Publish the certified tarball
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if npm view "@lupinum/nuxt-email@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "Version $RELEASE_VERSION already exists on npm" >&2
            exit 1
          fi
          case "$RELEASE_VERSION" in *-*) npm_tag=next ;; *) npm_tag=latest ;; esac
          npm publish .release/lupinum-nuxt-email.tgz --access public --tag "$npm_tag" --ignore-scripts --provenance

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verified-nuxt-email-release
          path: .release

      - name: Create the release for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          prerelease=()
          case "$RELEASE_VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$RELEASE_VERSION" .release/lupinum-nuxt-email.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --notes-file .release/release-notes.md \
            "${prerelease[@]}"
