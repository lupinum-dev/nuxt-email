packages:
  - .
  - playground
  - docs

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
enableGlobalVirtualStore: false

overrides:
  # Security floors for transitive build and documentation dependencies.
  # Remove an override after every parent resolves a patched version. Review after 2026-09-01.
  '@hono/node-server': 2.0.11
  '@nuxt/devtools': 3.3.1
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.4
  'brace-expansion@>=4.0.0 <5.0.9': 5.0.9
  browserslist: 4.28.7
  esbuild: 0.28.1
  'fflate@<0.7.5': 0.7.5
  fast-uri: 3.1.6
  h3: 1.15.11
  hono: 4.13.7
  ip-address: 10.3.1
  js-yaml: 4.3.2
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.4
  svgo: 4.1.0
  tar: 7.5.22
  tailwindcss: 4.1.18

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
