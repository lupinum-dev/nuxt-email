packages:
  - .
  - playground
  - docs

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
enableGlobalVirtualStore: false

overrides:
  # Security floors for transitive dev, build and docs dependencies. Remove each one when
  # deleting it and running `pnpm install` no longer brings back the version below the floor.
  # Remove when Nuxt's dependencies stop resolving a @nuxt/devtools that needs simple-git 4.
  '@nuxt/devtools': 3.3.1
  # Remove when @nuxt/devtools resolves @simple-git/argv-parser 2.0.1 or newer.
  '@simple-git/argv-parser': 2.0.1
  # Remove when every parent resolves brace-expansion 2.1.6 / 5.0.11 or newer.
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.6
  'brace-expansion@>=4.0.0 <6.0.0': 5.0.11
  # Remove when every parent resolves browserslist 4.28.7 or newer.
  browserslist: 4.28.7
  # Remove when every parent resolves esbuild 0.28.1 or newer.
  esbuild: 0.28.1
  # Remove when satori requires fflate 0.7.5 or newer.
  'fflate@<0.7.5': 0.7.5
  # Remove when every parent resolves js-yaml 4.3.2 or newer.
  js-yaml: 4.3.2
  # Remove when every parent resolves postcss 8.5.23 or newer.
  postcss: 8.5.23
  # Remove when every parent resolves sharp 0.35.4 or newer (some still ask for ^0.34.0).
  sharp: 0.35.5
  # One Tailwind compiler for the vendored engine, the docs site and the tests.
  # Remove when no other package resolves a different tailwindcss version.
  tailwindcss: 4.3.3

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
minimumReleaseAgeExclude:
  # Renovate security update: sharp@0.35.5
  - sharp@0.35.5
