packages:
  - playground
  - docs-site

enableGlobalVirtualStore: false

overrides:
  '@hono/node-server': 2.0.11
  esbuild: 0.28.1
  h3: 1.15.11
  sharp: 0.35.3
  tailwindcss: 4.1.18

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  # Reviewed Lupinum release candidates. Remove after 2026-08-14.
  - '@lupinum/ginko-content@0.4.0-rc.1'
  - '@lupinum/ginko-docs@0.3.0-rc.3'
